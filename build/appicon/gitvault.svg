<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    GitVault application mark: a shield holding a key.

    Drawn here rather than taken from an icon set, because an application's own identity should
    not be a third party's artwork with a licence attached. Only the two glyph ideas are
    borrowed conceptually; every path below is original to this project.
  -->
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6C5CE7"/>
      <stop offset="1" stop-color="#3B2FB5"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="#141422"/>

  <!-- Shield body -->
  <path fill="url(#shield)"
        d="M128 34 208 62v66c0 46-33 76-80 94-47-18-80-48-80-94V62z"/>

  <!-- Inner bevel, so the mark still reads at 16 px -->
  <path fill="#141422" opacity="0.18"
        d="M128 52 190 74v54c0 36-25 60-62 75-37-15-62-39-62-75V74z"/>

  <!-- Key: bow -->
  <circle cx="108" cy="112" r="26" fill="none" stroke="#FFFFFF" stroke-width="14"/>
  <!-- Key: shaft and wards -->
  <path fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"
        d="M127 131 176 180M158 162 143 177M176 180 163 193"/>
</svg>
